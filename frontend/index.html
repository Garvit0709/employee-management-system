
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <h1>Employee Management System</h1>
        <p>Manage employee information</p>
    </header>

    <main>
        <section class="employee-section">
            <div class="section-heading">
                <h2>Employee Records</h2>
                <button id="addBtn">Add Employee</button>
            </div>

            <input type="text" id="searchInput"
                   placeholder="Search by name, department or role">

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th data-sort="id">ID</th>
                            <th data-sort="name">Name</th>
                            <th data-sort="department">Department</th>
                            <th data-sort="role">Role</th>
                            <th data-sort="salary">Salary</th>
                            <th data-sort="join_date">Joining Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="employeeTable">
                    </tbody>
                </table>
            </div>

            <p id="tableMessage" role="status"></p>
        </section>

        <section class="form-section" id="formSection" hidden>
            <h2 id="formTitle">Add Employee</h2>

            <form id="employeeForm">
                <input type="hidden" id="employeeId">

                <label for="name">Full Name</label>
                <input type="text" id="name" maxlength="100" required>

                <label for="department">Department</label>
                <input type="text" id="department" maxlength="50" required>

                <label for="role">Role</label>
                <input type="text" id="role" maxlength="100" required>

                <label for="salary">Salary</label>
                <input type="number" id="salary" min="0"
                       max="99999999.99" step="0.01" required>

                <label for="joinDate">Joining Date</label>
                <input type="date" id="joinDate" required>

                <div class="form-buttons">
                    <button type="submit" id="saveBtn">Save Employee</button>
                    <button type="button" id="cancelBtn">Cancel</button>
                </div>

                <p id="formMessage" role="status"></p>
            </form>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
